<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Kritoma Card Editor</title><link rel="stylesheet" href="/src/nav-polish.css"/></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>(()=>{let opened=false;const tryOpen=()=>{if(opened)return true;const button=document.querySelector('.settingsButton');if(!button)return false;opened=true;button.click();return true};if(!tryOpen()){const observer=new MutationObserver(()=>{if(tryOpen())observer.disconnect()});observer.observe(document.getElementById('root'),{childList:true,subtree:true});setTimeout(()=>observer.disconnect(),4000)}})();</script></body></html>
