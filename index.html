<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Kritoma Card Editor</title><style>.bottomDock{display:none!important}.topBar{gap:12px}.quickNav{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}.quickNav button{height:38px;padding:0 11px;border:1px solid #35424e;background:#202a34;color:#f2f5f7;border-radius:11px;font:650 12px/1 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;cursor:pointer;transition:background .14s ease,border-color .14s ease,transform .14s ease}.quickNav button:hover{background:#2a3742;border-color:#465766}.quickNav button:active{transform:translateY(1px)}.quickNav button:first-child{background:#263845;border-color:#405565}.settingsButton{flex:0 0 auto;height:38px!important;padding:0 12px!important;border-radius:11px!important}.settingsButton span{display:none!important}.settingsButton b{display:inline!important}.workspace{padding-bottom:22px!important}@media(max-width:620px){.topBar{gap:6px;padding-left:10px!important;padding-right:10px!important}.brand>div{display:none!important}.brandMark{width:34px!important;height:34px!important}.quickNav{gap:4px}.quickNav button{height:36px;padding:0 8px;font-size:11px}.settingsButton{height:36px!important;padding:0 9px!important;font-size:11px!important}.workspace{padding-top:14px!important}}@media(max-width:390px){.quickNav button{padding:0 6px;font-size:10px}.settingsButton{padding:0 7px!important}.brandMark{width:31px!important;height:31px!important}}@media(min-width:1024px){.topBar{padding-right:24px!important}.quickNav button{min-width:58px}.workspace{padding-top:28px!important}.sheetBackdrop{top:76px!important}.settingsSheet{box-shadow:0 20px 50px #0009!important}}</style></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>(()=>{let desktopDefaultApplied=false;const wire=()=>{const root=document.getElementById('root'),top=root?.querySelector('.topBar'),edit=root?.querySelector('.settingsButton'),dock=root?.querySelector('.bottomDock');if(!top||!edit||!dock)return false;if(!top.querySelector('.quickNav')){const originals=Array.from(dock.querySelectorAll('button'));const byLabel=label=>originals.find(b=>(b.textContent||'').trim()===label);const nav=document.createElement('nav');nav.className='quickNav';nav.setAttribute('aria-label','Azioni rapide');[['Salva',byLabel('Salva')],['PNG',byLabel('PNG')],['PDF',byLabel('PDF')]].forEach(([label,source])=>{if(!source)return;const button=document.createElement('button');button.type='button';button.textContent=label;button.addEventListener('click',()=>source.click());nav.appendChild(button)});top.insertBefore(nav,edit)}dock.setAttribute('aria-hidden','true');if(!desktopDefaultApplied&&window.matchMedia('(min-width:1024px)').matches){desktopDefaultApplied=true;if(!root.querySelector('.sheetBackdrop'))edit.click()}else if(!desktopDefaultApplied){desktopDefaultApplied=true}return true};wire();const observer=new MutationObserver(()=>wire());observer.observe(document.getElementById('root'),{childList:true,subtree:true})})();</script></body></html>
