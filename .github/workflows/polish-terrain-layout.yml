name: Polish terrain layout

on:
  push:
    branches:
      - kritoma-terrain-editor

permissions:
  contents: write

jobs:
  polish-terrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: kritoma-terrain-editor
          fetch-depth: 0
      - name: Apply layout polish
        run: python3 .github/scripts/polish-terrain-layout.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit polish and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-terrain-layout.yml
          git rm .github/scripts/polish-terrain-layout.py
          git add src/TerrainEditor.tsx
          git commit -m "Polish scalable terrain slot layout"
          git push origin HEAD:kritoma-terrain-editor
