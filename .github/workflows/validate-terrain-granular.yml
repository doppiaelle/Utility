name: Validate granular terrain editor

on:
  push:
    branches:
      - kritoma-terrain-layer-slot-customization

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
