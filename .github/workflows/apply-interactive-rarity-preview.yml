name: Apply interactive rarity preview

on:
  push:
    branches:
      - kritoma-interactive-rarity-preview

permissions:
  contents: write

jobs:
  apply-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: kritoma-interactive-rarity-preview
          fetch-depth: 0

      - name: Apply interactive preview changes
        run: python3 .github/scripts/apply-interactive-rarity-preview.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-interactive-rarity-preview.yml
          git rm .github/scripts/apply-interactive-rarity-preview.py
          git rm .github/scripts/interactive-rarity-preview.css
          git add src/main.tsx src/styles.css
          git commit -m "Add interactive foil tilt preview for rarities"
          git push origin HEAD:kritoma-interactive-rarity-preview
