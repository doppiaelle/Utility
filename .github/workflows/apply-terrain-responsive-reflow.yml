name: Apply responsive terrain reflow

on:
  push:
    branches:
      - kritoma-terrain-responsive-reflow

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: kritoma-terrain-responsive-reflow
      - name: Apply structural reflow patch
        run: python scripts/patch_terrain_reflow.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Validate build
        run: npm run build
      - name: Commit application changes and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TerrainEditor.tsx
          git rm scripts/patch_terrain_reflow.py .github/workflows/apply-terrain-responsive-reflow.yml
          git commit -m "Make terrain sections structurally responsive"
          git push
